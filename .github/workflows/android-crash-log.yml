name: Android build + crash logcat

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "SDKMGR=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null || true
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run JVM unit tests
        run: ./gradlew test --stacktrace

      - name: Run food-pack tests
        run: python -m pytest metriq-foodpacks/tests -q

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Install emulator runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libgl1 libglib2.0-0

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true
          sudo chmod 666 /dev/kvm || true

      - name: Emulator prerequisites
        run: |
          df -h / || true
          ls "$ANDROID_HOME/system-images" 2>/dev/null || true
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -n 5 || true

      - name: Launch app on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity || true
            sleep 6
            adb exec-out screencap -p > screen-onboarding.png
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true || true
            sleep 12
            adb exec-out screencap -p > screen-home.png
            adb shell am force-stop com.metriq.app || true
            adb shell am start -a com.metriq.LOG -n com.metriq.app/.MainActivity --ez skip_onboarding true || true
            sleep 12
            adb exec-out screencap -p > screen-search.png
            adb shell pm grant com.metriq.app android.permission.CAMERA || true
            adb shell am force-stop com.metriq.app || true
            adb shell am start -a com.metriq.SCAN -n com.metriq.app/.MainActivity --ez skip_onboarding true || true
            sleep 12
            adb exec-out screencap -p > screen-scan.png
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true --es start_screen settings || true
            sleep 12
            adb shell input swipe 540 1900 540 800 400 || true
            sleep 1
            adb exec-out screencap -p > screen-settings-hevy.png
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true --es start_screen analytics || true
            sleep 12
            adb exec-out screencap -p > screen-analytics.png
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true --es start_screen integrations || true
            sleep 12
            adb exec-out screencap -p > screen-integrations.png
            adb shell wm size 1080x2400 || true
            adb shell wm density 480 || true
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true || true
            sleep 12
            adb exec-out screencap -p > screen-narrow-home.png
            adb shell wm density reset || true
            adb shell wm size reset || true

            # Dynamic type: verify the dense screens at 130% and 200% font scale.
            # The emulator runner executes each line as a separate /usr/bin/sh -c,
            # so avoid shell loops here and repeat the commands explicitly.
            adb shell settings put system font_scale 1.3 || true
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true || true
            sleep 12
            adb exec-out screencap -p > screen-font-1.3-home.png
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true --es start_screen analytics || true
            sleep 12
            adb exec-out screencap -p > screen-font-1.3-analytics.png
            adb shell settings put system font_scale 2.0 || true
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true || true
            sleep 12
            adb exec-out screencap -p > screen-font-2.0-home.png
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity --ez skip_onboarding true --es start_screen analytics || true
            sleep 12
            adb exec-out screencap -p > screen-font-2.0-analytics.png
            adb shell settings put system font_scale 1.0 || true
            adb shell am force-stop com.metriq.app || true
            adb shell am start -n com.metriq.app/.MainActivity || true
            sleep 12
            echo "=== LOGCAT (threadtime) ==="
            adb logcat -d -v threadtime > crash-log.txt
            echo "=== CRASH LINES ==="
            grep -i -E "FATAL|AndroidRuntime|MetriqCrash|Exception|ANR" crash-log.txt || echo "none"
            echo "=== PROCESS STATE ==="
            adb shell pidof com.metriq.app || echo "process not running"

      - name: Fail on crash or exception in logcat
        if: always()
        run: |
          if [ ! -f crash-log.txt ]; then
            echo "::error::crash-log.txt was not produced by the emulator step"
            exit 1
          fi
          # Fail only on signals of an uncaught crash/ANR. A bare "Exception" also
          # matches handled library errors, which would make this gate flaky.
          if grep -i -E "FATAL EXCEPTION|E/AndroidRuntime|MetriqCrash|ANR in" crash-log.txt; then
            echo "::error::Crash or ANR detected in logcat"
            exit 1
          fi
          echo "No FATAL/ANR crash signals in logcat"

      - name: Upload crash log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-log
          path: |
            crash-log.txt
            screen-*.png
          if-no-files-found: warn

      - name: Print crash log in the run summary
        if: always()
        run: |
          if [ -f crash-log.txt ]; then
            echo "```text" >> $GITHUB_STEP_SUMMARY
            tail -n 250 crash-log.txt >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi
